# Worker z plikami strony. Bez tras: wolany tylko przez wiazanie uslugowe
# z Workera `claude-code`, ktory stoi na sciezce /claude-code/.
name = "claude-code-assets"
main = "worker-assets/index.js"
compatibility_date = "2026-08-18"

[assets]
directory = "./public"
binding = "ASSETS"

# nie wystawiamy tego Workera pod wlasnym adresem: ma byc osiagalny wylacznie
# przez wiazanie uslugowe z Workera `claude-code`
workers_dev = false
preview_urls = false

[observability]
enabled = true
