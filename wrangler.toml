# Jeden Worker serwujacy strone pod sciezka /claude-code/ na istniejacej domenie.
# Katalog ./public odwzorowuje te sciezke (public/claude-code/...), bo Worker ze
# statycznymi zasobami dopasowuje pliki do pelnej sciezki zadania.
name = "claude-code"
compatibility_date = "2026-08-18"

[assets]
directory = "./public"

# Dwie trasy, bo wzorzec z /* nie lapie adresu bez ukosnika na koncu:
# /claude-code poszloby na stary origin i skonczylo sie jego 404.
# Sam ukosnik dokleja juz Cloudflare (html_handling = auto-trailing-slash).
[[routes]]
pattern = "lukaszpodgorski.pl/claude-code"
zone_name = "lukaszpodgorski.pl"

[[routes]]
pattern = "lukaszpodgorski.pl/claude-code/*"
zone_name = "lukaszpodgorski.pl"

[observability]
enabled = true
