# Worker stojacy na sciezce /claude-code/ na istniejacej domenie.
# Sam nie ma zadnych plikow: pyta o nie Workera `claude-code-assets` przez
# wiazanie uslugowe. Powod podzialu: Cloudflare nie pozwala kierowac Workera
# ze statycznymi zasobami na trase zawierajaca sciezke (tylko na cala nazwe hosta).
name = "claude-code"
main = "worker/index.js"
compatibility_date = "2026-08-18"

[[services]]
binding = "SITE"
service = "claude-code-assets"

# Dwie trasy, bo wzorzec z /* nie lapie adresu bez ukosnika na koncu:
# /claude-code poszloby na stary origin i skonczylo sie jego 404.
[[routes]]
pattern = "lukaszpodgorski.pl/claude-code"
zone_name = "lukaszpodgorski.pl"

[[routes]]
pattern = "lukaszpodgorski.pl/claude-code/*"
zone_name = "lukaszpodgorski.pl"

[observability]
enabled = true
