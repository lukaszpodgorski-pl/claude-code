name: deploy

# Kazdy push do main wdraza strone na Cloudflare. Commity robi tez automat
# (zadanie claude_code_timeline), wiec swieze wydania trafiaja online same.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "worker/**"
      - "worker-assets/**"
      - "wrangler.toml"
      - "wrangler.assets.toml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # kolejnosc ma znaczenie: Worker na sciezce ma wiazanie uslugowe do
      # Workera z plikami i bez niego nie da sie go wdrozyc
      - name: Worker z plikami
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.assets.toml

      - name: Worker na sciezce /claude-code/
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
