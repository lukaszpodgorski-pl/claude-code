name: deploy

# Kazdy push do main wdraza strone na Cloudflare. Commity robi tez automat
# (zadanie claude_code_timeline), wiec swieze wydania trafiaja online same.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "wrangler.toml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Worker na sciezce /claude-code/
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
